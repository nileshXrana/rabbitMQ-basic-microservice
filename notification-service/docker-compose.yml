services:
  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: development

    ports:
      - "8001:8001"

    volumes:
      - .:/app
      - notification_node_modules:/app/node_modules

    env_file:
      - .env

    networks:
      - backend

volumes:
  notification_node_modules:

networks:
  backend:
    external: true